[project]
name = "nexus-agent"
version = "0.1.0"
description = "综合业务智能 Agent 平台后端"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    # ORM / 数据库
    "SQLAlchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.0.0",
    # 数据校验 / 配置
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    # 认证
    "PyJWT>=2.10.1",
    "python-multipart>=0.0.20",
    # 对象存储
    "aioboto3>=14.0.0",
    "requests>=2.32.3",
    # 知识库：切片 / 向量化
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-huggingface>=0.1",
    "langchain-unstructured>=0.2",
    # LLM / Agent
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.3",
    # SSE 流式输出
    "sse-starlette>=2.0",
    "sentence-transformers>=5.7.0",
    "torch>=2.6.0",
    "transformers>=4.40,<5.0",
    "tiktoken>=0.9.0",
    "weaviate-client>=4.14.5",
    "jieba>=0.42.1",
    "redis>=5.2.1",
    "unstructured>=0.16.20",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# 国内建议设 HF_ENDPOINT=https://hf-mirror.com 下载 embedding 模型
